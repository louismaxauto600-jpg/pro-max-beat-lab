<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#050301">

  <meta
    name="description"
    content="PRO-MAX Beat Lab — kreye beat, melody ak mizik konplè sou entènèt."
  >

  <title>PRO-MAX Beat Lab</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --orange: #ff7518;
      --apricot: #ffb16a;
      --black: #050301;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--black);
    }

    body {
      display: grid;
      place-items: center;
      padding: 22px;
      overflow: hidden;
      color: var(--apricot);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      background:
        radial-gradient(
          circle at top,
          #542000 0%,
          #180902 42%,
          var(--black) 72%,
          #000000 100%
        );
    }

    .loading-card {
      width: min(100%, 560px);
      padding: 38px 25px;
      border: 2px solid var(--orange);
      border-radius: 24px;
      background:
        linear-gradient(
          145deg,
          #1d0c04,
          var(--black) 70%,
          #000000
        );
      box-shadow:
        0 0 35px rgba(255, 117, 24, 0.3),
        0 25px 65px #000000;
    }

    .music-icon {
      margin-bottom: 12px;
      color: var(--orange);
      font-size: 60px;
      text-shadow:
        0 0 25px rgba(255, 117, 24, 0.7);
      animation: pulse 1.2s ease-in-out infinite alternate;
    }

    h1 {
      margin-bottom: 12px;
      color: var(--orange);
      font-size: clamp(32px, 8vw, 56px);
      line-height: 1;
    }

    p {
      margin-bottom: 24px;
      color: var(--apricot);
      font-size: 17px;
      line-height: 1.5;
    }

    .open-button {
      display: inline-flex;
      width: min(100%, 300px);
      min-height: 56px;
      align-items: center;
      justify-content: center;
      padding: 13px 22px;
      color: #120701;
      font-size: 16px;
      font-weight: 900;
      text-decoration: none;
      border: 2px solid var(--orange);
      border-radius: 13px;
      background:
        linear-gradient(
          135deg,
          var(--apricot),
          var(--orange)
        );
      box-shadow:
        0 0 28px rgba(255, 117, 24, 0.4);
    }

    .open-button:active {
      transform: scale(0.97);
    }

    @keyframes pulse {
      from {
        transform: scale(0.94);
      }

      to {
        transform: scale(1.08);
      }
    }
  </style>
</head>

<body>
  <main class="loading-card">
    <div class="music-icon" aria-hidden="true">
      ♫
    </div>

    <h1>PRO-MAX BEAT LAB</h1>

    <p>
      Beat Lab la ap ouvri otomatikman.
    </p>

    <a
      class="open-button"
      href="https://pro-max-beat-lab.louismaxauto600.chatgpt.site"
    >
      OUVRI BEAT LAB
    </a>
  </main>

  <script>
    "use strict";

    const BEAT_LAB_URL =
      "https://pro-max-beat-lab.louismaxauto600.chatgpt.site";

    window.setTimeout(
      () => {
        window.location.replace(
          BEAT_LAB_URL
        );
      },
      300
    );
  </script>
</body>
</html>
